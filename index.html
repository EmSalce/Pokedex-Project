<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeDex</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="pokedex-header">
      <div class="pokedex-lights">
        <div class="light big"></div>
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <h1>Pokedex</h1>

      <!-- Search input and button -->
      <div>
        <form id="search-form">
          <input
            id="search-input"
            list="search-list"
            placeholder="Search by Name"
          />
          <datalist id="search-list"></datalist>
          <button type="submit">SEARCH</button>
        </form>
      </div>

      <!-- Navigation Buttons -->
      <nav class="pokedex-nav">
        <a href="/index.html" class="nav-button active">Pokédex</a>
        <a href="/types.html" class="nav-button">Type Explorer</a>
      </nav>
    </header>

    <!-- Loading text before Pokemon Grid pops up -->
    <div id="loading">
      <div class="load-text">Now Loading...</div>
    </div>

    <!-- Grid for the cards -->
    <div id="pokedex-grid" class="pokedex-grid">
      <!-- Cards go here -->
    </div>

    <footer class="pokedex-footer">
      <!-- Button to return to top -->
      <button
        onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        id="btnTop"
        alt="Return to Top"
      >
        ↑
      </button>

      <p>Pokédex Project © 2026</p>

      <p>
        Pokémon data provided by
        <a href="https://pokeapi.co/" target="_blank">PokéAPI</a>
      </p>

      <p>
        Built by
        <a
          href="https://github.com/EmSalce"
          target="_blank"
          rel="noopener noreferrer"
        >
          Emilio Salce
        </a>
      </p>
    </footer>

    <!-- Big window with details -->
    <div id="pokemon-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span id="close-modal">&times;</span>
        </div>

        <div id="modal-body"></div>
      </div>
    </div>
    <script src="pokemon-data.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
