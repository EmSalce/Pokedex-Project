<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pokédex - Type Explorer</title>

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <!-- Pokédex Header -->

    <header class="pokedex-header">
      <div class="pokedex-lights">
        <div class="light big"></div>
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>

      <h1>Type Explorer</h1>
      <!-- Navigation Buttons -->
      <nav class="pokedex-nav">
        <a href="/index.html" class="nav-button">Pokédex</a>
        <a href="/types.html" class="nav-button active">Type Explorer</a>
      </nav>
    </header>

    <!-- Type Explorer -->

    <main class="type-explorer">
      <section class="type-selector">
        <h2>Select a Type</h2>

        <div id="type-buttons" class="type-buttons">
          <!-- Type buttons will be generated by JavaScript -->
        </div>
      </section>

      <!-- Selected Type -->

      <section class="type-results">
        <h2 id="selected-type">Select a type to begin</h2>

        <!-- Type Matchup -->
        <div id="type-matchup" class="type-matchup">
          <p class="matchup-placeholder">Select a type to view its matchups.</p>
        </div>

        <!-- Loading text -->

        <div id="loading">
          <div class="load-text">Now Loading...</div>
        </div>

        <!-- Pokémon Grid -->

        <div id="pokedex-grid" class="pokedex-grid">
          <!-- Pokémon cards go here -->
        </div>
      </section>
    </main>

    <!-- Footer -->

    <footer class="pokedex-footer">
      <!-- Button to return to top -->

      <button
        onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        id="btnTop"
        aria-label="Return to Top"
      >
        ↑
      </button>

      <p>Pokédex Project © 2026</p>

      <p>
        Pokémon data provided by
        <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">
          PokéAPI
        </a>
      </p>

      <p>
        Built by
        <a
          href="https://github.com/EmSalce"
          target="_blank"
          rel="noopener noreferrer"
        >
          Emilio Salce
        </a>
      </p>
    </footer>

    <!-- Pokémon Modal -->

    <div id="pokemon-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span id="close-modal" role="button" aria-label="Close modal">
            &times;
          </span>
        </div>

        <div id="modal-body"></div>
      </div>
    </div>

    <!-- JavaScript -->

    <script src="pokemon-data.js"></script>
    <script src="types.js"></script>
  </body>
</html>
